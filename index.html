<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer & Builder | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: #111111;
            --border: #1a1a1a;
            --border-hover: #2a2a2a;
            --text-main: #f5f5f5;
            --text-muted: #888888;
            --status-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: 100vh;
            max-width: 1100px;
            margin: 0 auto;
            gap: 60px;
            padding: 80px 40px;
        }

        .sidebar {
            position: sticky;
            top: 80px;
            height: fit-content;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .profile h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .profile p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            width: fit-content;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--status-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--status-green);
        }

        .contacts {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            padding-top: 30px;
        }

        .contacts a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contacts a:hover {
            color: var(--text-main);
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .content-title {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .project-row {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.2s, background-color 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .project-row:hover {
            border-color: var(--border-hover);
            background-color: #141414;
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .project-title {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .project-arrow {
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: transform 0.2s, color 0.2s;
        }

        .project-row:hover .project-arrow {
            transform: translate(2px, -2px);
            color: var(--text-main);
        }

        .project-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            max-width: 580px;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }

        .tech-item {
            font-family: monospace;
            font-size: 0.75rem;
            color: #555555;
            background-color: #0d0d0d;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
                padding: 40px 20px;
                gap: 40px;
            }

            .sidebar {
                position: static;
                border-bottom: 1px solid var(--border);
                padding-bottom: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="layout">
        
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="profile">
                <h1>Builder</h1>
                <p>Web Developer & rapid prototyping specialist.</p>
            </div>

            <div class="status-badge">
                <span class="status-dot"></span>
                <span>Available for MVPs</span>
            </div>

            <nav class="contacts">
                <a href="https://discord.com" target="_blank">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Discord: username_here
                </a>
                <a href="https://github.com/yourusername" target="_blank">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                    GitHub
                </a>
            </nav>
        </aside>

        <!-- CONTENT -->
        <main class="content">
            <div>
                <h2 class="content-title">Featured Projects</h2>
                <div class="projects-list" id="project-list">
                    <p style="color: var(--text-muted)">Syncing with GitHub...</p>
                </div>
            </div>
        </main>

    </div>

    <script>
        // Вкажіть ваш нікнейм на GitHub
        const GITHUB_USERNAME = 'vladkryvda'; 
        
        // Тег, за яким ми будемо фільтрувати проекти для портфоліо
        const TARGET_TOPIC = 'portfolio';

        const CACHE_KEY = 'portfolio_github_cache';
        const CACHE_EXPIRY = 30 * 60 * 1000; // Кешування на 30 хвилин

        async function init() {
            const container = document.getElementById('project-list');
            const cachedData = localStorage.getItem(CACHE_KEY);
            const cachedTime = localStorage.getItem(CACHE_KEY + '_time');
            const now = Date.now();

            if (cachedData && cachedTime && (now - cachedTime < CACHE_EXPIRY)) {
                render(JSON.parse(cachedData));
                return;
            }

            try {
                // Отримуємо список усіх репозиторіїв користувача (до 100 шт, відсортовані за останнім оновленням)
                const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100&sort=updated`);
                if (!response.ok) throw new Error('Failed to fetch from GitHub');
                
                const allRepos = await response.json();

                // Фільтруємо репозиторії, у яких в topics є тег 'portfolio'
                const filteredProjects = allRepos
                    .filter(repo => repo.topics && repo.topics.includes(TARGET_TOPIC))
                    .map(repo => {
                        // Форматуємо назву (наприклад, "my-awesome-app" -> "My Awesome App")
                        const formattedTitle = repo.name
                            .replace(/-/g, ' ')
                            .replace(/\b\w/g, l => l.toUpperCase());

                        // Видаляємо тег 'portfolio' зі списку технологій, залишаючи інші теги
                        const techTags = repo.topics.filter(topic => topic !== TARGET_TOPIC);
                        
                        // Якщо інших тегів немає, використовуємо основну мову програмування репозиторію
                        if (techTags.length === 0 && repo.language) {
                            techTags.push(repo.language);
                        }

                        return {
                            title: formattedTitle,
                            description: repo.description || 'No description provided.',
                            // Якщо не вказано лінк на готовий сайт, ведемо на сам репозиторій
                            liveUrl: repo.homepage || repo.html_url, 
                            tech: techTags
                        };
                    });

                localStorage.setItem(CACHE_KEY, JSON.stringify(filteredProjects));
                localStorage.setItem(CACHE_KEY + '_time', now.toString());

                render(filteredProjects);

            } catch (error) {
                console.error(error);
                container.innerHTML = '<p style="color: var(--text-muted)">Failed to sync with GitHub. Please try again later.</p>';
            }
        }

        function render(projectsList) {
            const container = document.getElementById('project-list');
            if (projectsList.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted)">No projects tagged with '${TARGET_TOPIC}' found.</p>`;
                return;
            }
            
            container.innerHTML = projectsList.map(project => {
                return `
                    <a href="${project.liveUrl}" target="_blank" class="project-row">
                        <div class="project-header">
                            <span class="project-title">${project.title}</span>
                            <span class="project-arrow">↗</span>
                        </div>
                        <p class="project-desc">${project.description}</p>
                        <div class="project-tech">
                            ${project.tech.map(tech => `<span class="tech-item">${tech}</span>`).join('')}
                        </div>
                    </a>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
